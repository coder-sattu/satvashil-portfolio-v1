<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Satvashil Bhosale — Agentic AI Engineer</title>
  <meta name="description"
    content="Satvashil Bhosale builds multi-agent AI systems, Compound AI pipelines, LangGraph orchestration, RAG/GraphRAG, and edge computer vision." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0B0E22;
      --ink-2: #121633;
      --ink-3: #1A2045;
      --line: rgba(158, 166, 226, .16);
      --line-2: rgba(158, 166, 226, .32);
      --text: #ECEBFA;
      --muted: #9FA5D0;
      --dim: #6F76A3;
      --peri: #8F94FF;
      --peri-glow: rgba(143, 148, 255, .35);
      --apricot: #F2A25C;
      --apricot-glow: rgba(242, 162, 92, .35);
      --cyan: #48E5C2;
      --cyan-glow: rgba(72, 229, 194, .35);
      --measure: 68ch;
      --pad: clamp(16px, 4vw, 54px);
      --maxw: 1180px;
    }

    :root:not([data-theme="light"]),
    :root[data-theme="dark"] {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16.5px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* 3D background canvas */
    #bg-neural-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* Page content sits above 3D background */
    #root {
      position: relative;
      z-index: 1;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--apricot);
      outline-offset: 3px;
      border-radius: 3px;
    }

    ::selection {
      background: var(--peri);
      color: #0B0E22;
    }

    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding-inline: var(--pad);
    }

    /* Navbar */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 14, 34, .84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      transition: background .2s ease;
    }

    .nav-in {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
    }

    .mark {
      font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -.02em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mark-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--apricot);
      flex: none;
      box-shadow: 0 0 10px var(--apricot-glow);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 14.5px;
      color: var(--muted);
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
      transition: color .18s, border-color .18s;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a.on {
      color: var(--text);
      border-bottom-color: var(--apricot);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-cta {
      font-size: 13.5px;
      text-decoration: none;
      color: var(--peri);
      font-weight: 500;
      padding: 6px 14px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      transition: all .2s ease;
    }

    .nav-cta:hover {
      background: rgba(143, 148, 255, .14);
      border-color: var(--peri);
    }

    /* Mobile menu toggle button */
    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--text);
    }

    .nav-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text);
      margin: 4px 0;
      transition: transform .2s ease, opacity .2s ease;
    }

    .nav-toggle.open span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .nav-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.open span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* Mobile Navigation Drawer */
    .mobile-drawer {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: rgba(11, 14, 34, .96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line-2);
      padding: 20px 24px;
      z-index: 99;
      flex-direction: column;
      gap: 16px;
      animation: slideDown 0.25s ease-out;
    }

    .mobile-drawer.open {
      display: flex;
    }

    .mobile-drawer a {
      text-decoration: none;
      font-size: 16px;
      color: var(--muted);
      padding: 8px 0;
      border-bottom: 1px solid rgba(158, 166, 226, .08);
      font-weight: 500;
    }

    .mobile-drawer a:hover,
    .mobile-drawer a.on {
      color: var(--apricot);
    }

    .mobile-drawer .drawer-cta {
      margin-top: 8px;
      text-align: center;
      background: var(--apricot);
      color: #100d23;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width:860px) {
      .nav-links {
        display: none;
      }

      .nav-toggle {
        display: block;
      }
    }

    /* Hero section */
    .hero {
      padding-top: clamp(36px, 7vw, 84px);
      padding-bottom: 12px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(310px, 400px);
      gap: clamp(24px, 4vw, 56px);
      align-items: center;
    }

    @media (max-width:920px) {
      .hero-grid {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
    }

    .avail {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--muted);
      background: rgba(20, 25, 56, .7);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 14px;
      margin: 0 0 20px;
      font-family: "IBM Plex Mono", monospace;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      flex: none;
      box-shadow: 0 0 0 0 rgba(72, 229, 194, .6);
      animation: pulse 2.4s ease-out infinite;
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 9px rgba(72, 229, 194, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(72, 229, 194, 0);
      }
    }

    h1.name {
      font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
      font-weight: 800;
      font-size: clamp(2.8rem, 7.5vw, 5.2rem);
      line-height: .96;
      letter-spacing: -.035em;
      margin: 0 0 20px;
      background: linear-gradient(135deg, #FFFFFF 30%, #C3C7F5 80%, #F2A25C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lede {
      font-size: clamp(1.1rem, 1.8vw, 1.36rem);
      line-height: 1.45;
      max-width: 34ch;
      margin: 0 0 14px;
      font-weight: 500;
      color: var(--text);
    }

    .sub {
      color: var(--muted);
      max-width: 58ch;
      margin: 0 0 26px;
      font-size: 16px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tech-badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      background: rgba(26, 32, 69, .6);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .tech-badge.highlight {
      border-color: var(--apricot);
      color: var(--apricot);
      background: rgba(242, 162, 92, .1);
    }

    .tech-badge.cyan {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(72, 229, 194, .1);
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      text-decoration: none;
      padding: 9px 18px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      color: var(--text);
      transition: all .2s ease;
      font-weight: 500;
    }

    .btn:hover {
      border-color: var(--peri);
      background: rgba(143, 148, 255, .12);
      transform: translateY(-1px);
    }

    .btn.solid {
      background: var(--apricot);
      border-color: var(--apricot);
      color: #100D22;
      font-weight: 600;
      box-shadow: 0 4px 18px var(--apricot-glow);
    }

    .btn.solid:hover {
      background: #f7b57b;
      border-color: #f7b57b;
      transform: translateY(-1px);
    }

    /* 3D Robot & Visual Showcase Shell */
    .hero-3d-card {
      position: relative;
      width: 100%;
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(20, 25, 56, .9) 0%, rgba(14, 17, 40, .85) 100%);
      border: 1px solid var(--line-2);
      padding: 16px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .45), 0 0 35px rgba(143, 148, 255, .08);
      backdrop-filter: blur(10px);
    }

    .hero-3d-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .view-tabs {
      display: inline-flex;
      background: rgba(11, 14, 34, .6);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px;
    }

    .view-tab {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      border: none;
      background: none;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all .18s ease;
    }

    .view-tab.active {
      background: var(--ink-3);
      color: var(--text);
      border: 1px solid var(--line-2);
    }

    .telemetry-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .telemetry-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    .hero-canvas-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 12px;
      background: radial-gradient(circle at center, rgba(30, 36, 78, .6) 0%, rgba(11, 14, 34, .95) 75%);
      border: 1px solid var(--line);
      overflow: hidden;
      cursor: grab;
    }

    .hero-canvas-wrap:active {
      cursor: grabbing;
    }

    .hero-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3D overlay telemetry */
    .canvas-hud {
      position: absolute;
      inset: auto 12px 12px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      color: var(--dim);
    }

    .hud-box {
      background: rgba(11, 14, 34, .75);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
    }

    .hud-box span {
      color: var(--apricot);
    }

    /* Photo display alternative */
    .photo-frame {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--ink-2);
      border: 1px solid var(--line);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
    }

    .photo-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(11, 14, 34, .8) 0%, rgba(11, 14, 34, 0) 45%);
    }

    .photo-caption {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      color: var(--text);
    }

    /* Interactive Pipeline Graph */
    .graph-band {
      margin-top: clamp(40px, 6vw, 72px);
      border-top: 1px solid var(--line);
      padding-top: 28px;
    }

    .graph-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .graph-title {
      font-size: 15px;
      color: var(--muted);
      margin: 0;
    }

    .replay {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      background: none;
      border: 1px solid var(--line-2);
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .18s;
    }

    .replay:hover {
      color: var(--text);
      border-color: var(--peri);
      background: rgba(143, 148, 255, .1);
    }

    .replay[disabled] {
      opacity: .45;
      cursor: default;
    }

    .graph-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .edge {
      fill: none;
      stroke: var(--line-2);
      stroke-width: 1.4;
    }

    .edge-lit {
      fill: none;
      stroke: var(--peri);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset .5s cubic-bezier(.4, 0, .2, 1);
    }

    .edge-lit.done {
      stroke-dashoffset: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .edge-lit {
        transition: none;
      }
    }

    .gnode {
      cursor: pointer;
    }

    .gnode .disc {
      fill: var(--ink-2);
      stroke: var(--line-2);
      stroke-width: 1.4;
      transition: fill .3s, stroke .3s;
    }

    .gnode .halo {
      fill: none;
      stroke: var(--apricot);
      stroke-width: 1.4;
      opacity: 0;
      transition: opacity .3s;
    }

    .gnode .glyph {
      fill: var(--dim);
      transition: fill .3s;
    }

    .gnode .lbl {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      fill: var(--dim);
      transition: fill .3s;
    }

    .gnode:hover .disc {
      stroke: var(--peri);
      fill: var(--ink-3);
    }

    .gnode.past .disc {
      stroke: var(--peri);
    }

    .gnode.past .glyph {
      fill: var(--peri);
    }

    .gnode.past .lbl {
      fill: var(--muted);
    }

    .gnode.live .disc {
      fill: var(--apricot);
      stroke: var(--apricot);
      box-shadow: 0 0 12px var(--apricot);
    }

    .gnode.live .glyph {
      fill: #100D22;
      font-weight: bold;
    }

    .gnode.live .lbl {
      fill: var(--text);
      font-weight: 600;
    }

    .gnode.live .halo {
      opacity: .6;
    }

    .gcard {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0 18px;
      align-items: start;
    }

    .gcard-idx {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      color: var(--apricot);
      padding-top: 4px;
      font-weight: 600;
    }

    .gcard h3 {
      font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
      font-size: 1.34rem;
      letter-spacing: -.02em;
      margin: 0 0 6px;
      font-weight: 600;
    }

    .gcard p {
      margin: 0 0 12px;
      color: var(--muted);
      max-width: 62ch;
      font-size: 15.5px;
      line-height: 1.55;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 3px 9px;
      background: rgba(18, 22, 51, .7);
    }

    .chip.gold {
      border-color: var(--apricot);
      color: var(--apricot);
      background: rgba(242, 162, 92, .08);
    }

    .chip.cyan {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(72, 229, 194, .08);
    }

    /* 3D Tilt Card Class */
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, border-color 0.25s, box-shadow 0.25s;
      position: relative;
      will-change: transform;
    }

    .tilt-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(143, 148, 255, .08), transparent 40%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 2;
    }

    .tilt-card:hover::before {
      opacity: 1;
    }

    /* Section styling */
    .sec {
      padding-block: clamp(52px, 8vw, 96px);
    }

    .sec-head {
      font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
      font-size: clamp(1.8rem, 3.4vw, 2.5rem);
      letter-spacing: -.03em;
      line-height: 1.1;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .sec-note {
      color: var(--muted);
      max-width: var(--measure);
      margin: 0 0 clamp(28px, 4vw, 42px);
      font-size: 16px;
    }

    /* Capabilities grid */
    .caps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width:760px) {
      .caps {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .cap {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      background: rgba(18, 22, 51, .45);
      backdrop-filter: blur(6px);
    }

    .cap:hover {
      border-color: var(--peri);
    }

    .cap-icon {
      font-size: 22px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .cap h3 {
      font-size: 1.12rem;
      margin: 0 0 8px;
      font-weight: 600;
      color: var(--text);
    }

    .cap p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    /* Systems architecture */
    .sys {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px clamp(16px, 3vw, 28px);
      margin-bottom: 48px;
      background: rgba(18, 22, 51, .5);
      backdrop-filter: blur(8px);
    }

    .sys:hover {
      border-color: var(--line-2);
    }

    .sys-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    @media (max-width:640px) {
      .sys-top {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .sys h3 {
      font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      letter-spacing: -.025em;
      margin: 0 0 6px;
      font-weight: 600;
    }

    .sys-kind {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--apricot);
      margin: 0 0 8px;
    }

    .sys-premise {
      color: var(--muted);
      margin: 0;
      max-width: 60ch;
      font-size: 15.5px;
    }

    .repo {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      text-decoration: none;
      color: var(--peri);

  <script>
    /* ---------------------------------------------------- Ambient 3D Neural Canvas */
    (function initNeuralCanvas() {
      const canvas = document.getElementById("bg-neural-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const count = width < 768 ? 32 : 64;
      const particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.8 + 1,
          color: Math.random() > 0.4 ? "rgba(143,148,255," : "rgba(242,162,92,"
        });
      }

      let mouseX = width / 2, mouseY = height / 2;
      window.addEventListener("pointermove", (e) => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }, { passive: true });

      function render() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < count; i++) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;

          // Draw particle node
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color + "0.65)";
          ctx.fill();

          // Connect with neighbors
          for (let j = i + 1; j < count; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x, dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              const alpha = (1 - dist / 120) * 0.16;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = "rgba(158,166,226," + alpha + ")";
              ctx.lineWidth = 0.9;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(render);
      }
      render();
    })();

    /* ---------------------------------------------------- 3D Robot Component (Three.js) */
    function RobotAgent3D() {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container || typeof THREE === "undefined") return;

        let width = container.clientWidth || 340;
        let height = container.clientHeight || 320;

        // Scene & Camera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 8.5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        // Master Group for Robot
        const robotGroup = new THREE.Group();
        scene.add(robotGroup);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0x8F94FF, 1.8);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xF2A25C, 1.4);
        dirLight2.position.set(-5, -3, 3);
        scene.add(dirLight2);

        // 1. Robot Head / Core (Cyber Octahedron / Polyhedron Chassis)
        const headGeo = new THREE.IcosahedronGeometry(1.6, 1);
        const headMat = new THREE.MeshStandardMaterial({
          color: 0x141938,
          metalness: 0.85,
          roughness: 0.25,
          wireframe: false,
        });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        robotGroup.add(headMesh);

        // Wireframe overlay on head
        const wireGeo = new THREE.IcosahedronGeometry(1.62, 1);
        const wireMat = new THREE.MeshBasicMaterial({
          color: 0x8F94FF,
          wireframe: true,
          transparent: true,
          opacity: 0.35,
        });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        robotGroup.add(wireMesh);

        // 2. Visor / Glowing Cyber Optic Eye
        const visorGeo = new THREE.BoxGeometry(1.5, 0.32, 0.7);
        const visorMat = new THREE.MeshStandardMaterial({
          color: 0x48E5C2,
          emissive: 0x48E5C2,
          emissiveIntensity: 0.9,
          roughness: 0.1,
        });
        const visorMesh = new THREE.Mesh(visorGeo, visorMat);
        visorMesh.position.set(0, 0.2, 1.35);
        robotGroup.add(visorMesh);

        // Secondary optic sensor
        const eyeGeo = new THREE.SphereGeometry(0.16, 16, 16);
        const eyeMat = new THREE.MeshStandardMaterial({
          color: 0xF2A25C,
          emissive: 0xF2A25C,
          emissiveIntensity: 1.2,
        });
        const eyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
        eyeMesh.position.set(0, 0.2, 1.72);
        robotGroup.add(eyeMesh);

        // 3. Dual Concentric Gimbal Gyro Rings
        const ring1Geo = new THREE.TorusGeometry(2.35, 0.045, 16, 64);
        const ring1Mat = new THREE.MeshStandardMaterial({ color: 0x8F94FF, metalness: 0.9, roughness: 0.1 });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        robotGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(2.7, 0.035, 16, 64);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xF2A25C, metalness: 0.9, roughness: 0.2 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2.8;
        robotGroup.add(ring2);

        // 4. Orbiting Agent Worker Drones (4 Satellites)
        const satellites = [];
        const satCount = 4;
        const satGeo = new THREE.OctahedronGeometry(0.24, 0);
        const satColors = [0x48E5C2, 0x8F94FF, 0xF2A25C, 0xE9E8F6];

        for (let i = 0; i < satCount; i++) {
          const sMat = new THREE.MeshStandardMaterial({
            color: satColors[i],
            emissive: satColors[i],
            emissiveIntensity: 0.7,
            roughness: 0.2,
          });
          const sMesh = new THREE.Mesh(satGeo, sMat);
          robotGroup.add(sMesh);
          satellites.push({ mesh: sMesh, angle: (i * Math.PI * 2) / satCount, radius: 3.2, speed: 0.02 + i * 0.005 });
        }

        // 5. Floating Aura Particles
        const particleCount = 75;
        const pGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
          pPositions[i] = (Math.random() - 0.5) * 8;
          pPositions[i + 1] = (Math.random() - 0.5) * 8;
          pPositions[i + 2] = (Math.random() - 0.5) * 8;
        }
        pGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x8F94FF, size: 0.065, transparent: true, opacity: 0.65 });
        const particleSystem = new THREE.Points(pGeo, pMat);
        robotGroup.add(particleSystem);

        // Interaction state: Mouse/Touch tracking
        let targetRotX = 0, targetRotY = 0;
        let clickFlash = 0;

        const onPointerMove = (e) => {
          const rect = container.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          targetRotY = (x - 0.5) * 1.5;
          targetRotX = (y - 0.5) * 1.2;
        };

        const onClick = () => {
          clickFlash = 1.0;
          eyeMat.emissiveIntensity = 3.0;
          visorMat.emissiveIntensity = 2.5;
        };

        container.addEventListener("pointermove", onPointerMove);
        container.addEventListener("pointerdown", onClick);

        // Resize Handler
        const onResize = () => {
          if (!container) return;
          width = container.clientWidth;
          height = container.clientHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        };
        window.addEventListener("resize", onResize);

        // Animation Loop
        let animId;
        let clock = new THREE.Clock();

        const animate = () => {
          animId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          // Smooth tracking lerp
          robotGroup.rotation.y += (targetRotY - robotGroup.rotation.y) * 0.08;
          robotGroup.rotation.x += (targetRotX - robotGroup.rotation.x) * 0.08;

          // Floating gentle bobbing
          robotGroup.position.y = Math.sin(elapsedTime * 1.8) * 0.14;

          // Rotate Gimbal Rings
          ring1.rotation.z = elapsedTime * 0.5;
          ring1.rotation.y = elapsedTime * 0.3;
          ring2.rotation.x = elapsedTime * 0.4 + Math.PI / 3;
          ring2.rotation.z = elapsedTime * 0.6;

          // Orbiting agent worker drones
          satellites.forEach((sat) => {
            sat.angle += sat.speed;
            sat.mesh.position.x = Math.cos(sat.angle) * sat.radius;
            sat.mesh.position.z = Math.sin(sat.angle) * sat.radius;
            sat.mesh.position.y = Math.sin(sat.angle * 2 + elapsedTime) * 0.7;
            sat.mesh.rotation.x += 0.03;
            sat.mesh.rotation.y += 0.04;
          });

          // Visor scan oscillation
          eyeMesh.position.x = Math.sin(elapsedTime * 4.0) * 0.45;

          // Click shockwave cooldown
          if (clickFlash > 0) {
            clickFlash -= 0.03;
            eyeMat.emissiveIntensity = 1.2 + clickFlash * 2.0;
            visorMat.emissiveIntensity = 0.9 + clickFlash * 1.6;
          }

          particleSystem.rotation.y = elapsedTime * 0.05;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener("resize", onResize);
          container.removeEventListener("pointermove", onPointerMove);
          container.removeEventListener("pointerdown", onClick);
          renderer.dispose();
        };
      }, []);

      return <div ref={mountRef} style={{ width: "100%", height: "100%" }} />;
    }

    /* ---------------------------------------------------- 3D Interactive Tilt Card */
    function TiltCard({ children, className = "", style = {} }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;

        card.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
        card.style.setProperty("--mouse-x", `${x}px`);
        card.style.setProperty("--mouse-y", `${y}px`);
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        card.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0px)";
      };

      return (
        <div
          ref={cardRef}
          className={`tilt-card ${className}`}
          style={style}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
        >
          {children}
        </div>
      );
    }

    /* ---------------------------------------------------- Workflow Diagram Renderer */
    function wfPath(a, b, dir) {
      if (dir === "v") {
        const x1 = a.x + NW / 2, x2 = b.x + NW / 2;
        const y1 = a.y + NH, y2 = b.y;
        const my = (y1 + y2) / 2;
        return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
      }
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
      const mx = (x1 + x2) / 2;
      return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    }

    function WorkflowGraph({ g, name }) {
      const byId = {};
      g.nodes.forEach((n) => { byId[n.id] = n; });
      return (
        <svg className="sysgraph" viewBox={g.vb} role="img" aria-label={"Architecture diagram for " + name}>
          <defs>
            <marker id={"ah-" + name.replace(/\W/g, "")} viewBox="0 0 8 8" refX="7" refY="4"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--peri)" />
            </marker>
          </defs>
          {g.edges.map((e, i) => (
            <path key={"we" + i} className={"sw-edge animated" + (e.dash ? " dash" : "")}
              d={wfPath(byId[e.f], byId[e.t], e.dir)}
              markerEnd={`url(#ah-${name.replace(/\W/g, "")})`} />
          ))}
          {(g.loops || []).map((l, i) => (
            <g key={"wl" + i}>
              <path className="sw-edge animated dash" d={l.d} markerEnd={`url(#ah-${name.replace(/\W/g, "")})`} />
              <text className="sw-lbl" x={l.lx} y={l.ly} textAnchor="middle">{l.label}</text>
            </g>
          ))}
          {g.nodes.map((n) => (
            <g key={n.id}>
              <rect className={"sw-box " + n.kind} x={n.x} y={n.y} width={NW} height={NH} rx="7" />
              {n.lines.length === 1
                ? <text className={"sw-t" + (n.kind === "io" || n.kind === "store" ? " soft" : "")}
                  x={n.x + NW / 2} y={n.y + NH / 2 + 4} textAnchor="middle">{n.lines[0]}</text>
                : n.lines.map((ln, j) => (
                  <text key={j} className={"sw-t" + (n.kind === "io" || n.kind === "store" ? " soft" : "")}
                    x={n.x + NW / 2} y={n.y + 17 + j * 15} textAnchor="middle">{ln}</text>
                ))}
            </g>
          ))}
        </svg>
      );
    }

    const LEGEND = [
      ["agent", "autonomous agent"],
      ["tool", "deterministic tool"],
      ["guard", "policy / guardrail"],
      ["store", "data store / lakehouse"],
      ["io", "input / output"],
    ];

    /* ---------------------------------------------------- Hero Interactive Pipeline */
    function useNarrow(bp = 780) {
      const [n, setN] = useState(typeof window !== "undefined" ? window.innerWidth < bp : false);
      useEffect(() => {
        const on = () => setN(window.innerWidth < bp);
        window.addEventListener("resize", on);
        return () => window.removeEventListener("resize", on);
      }, [bp]);
      return n;
    }

    function heroLayout(narrow, n) {
      if (narrow) {
        const stepY = 88, x = 32, y0 = 32;
        return {
          vb: `0 0 320 ${y0 + stepY * (n - 1) + 40}`,
          pts: Array.from({ length: n }, (_, i) => ({ x, y: y0 + stepY * i })),
          labelDX: 24, labelDY: 5, anchor: "start", vertical: true
        };
      }
      const stepX = 160, x0 = 40;
      return {
        vb: `0 0 ${x0 * 2 + stepX * (n - 1)} 170`,
        pts: Array.from({ length: n }, (_, i) => ({ x: x0 + stepX * i, y: i % 2 ? 104 : 54 })),
        labelDX: 0, labelDY: 38, anchor: "middle", vertical: false
      };
    }

    function heroEdge(a, b, vertical) {
      if (vertical) return `M ${a.x} ${a.y + 19} L ${b.x} ${b.y - 19}`;
      const mx = (a.x + b.x) / 2;
      return `M ${a.x + 20} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x - 20} ${b.y}`;
    }

    function HeroGraph({ active, setActive }) {
      const narrow = useNarrow();
      const L = heroLayout(narrow, PIPELINE.length);
      return (
        <svg className="graph-svg" viewBox={L.vb} role="img"
          aria-label="Agent pipeline: take the call, decide, lakehouse, retrieve, graph reasoning, act, trace.">
          {L.pts.slice(0, -1).map((p, i) => (
            <g key={"e" + i}>
              <path className="edge" d={heroEdge(p, L.pts[i + 1], L.vertical)} />
              <path className={"edge-lit" + (i < active ? " done" : "")} pathLength="1" d={heroEdge(p, L.pts[i + 1], L.vertical)} />
            </g>
          ))}
          {L.pts.map((p, i) => {
            const state = i === active ? "live" : i < active ? "past" : "";
            const node = PIPELINE[i];
            return (
              <g key={node.key} className={"gnode " + state} tabIndex="0" role="button"
                aria-label={node.title} aria-pressed={i === active}
                onClick={() => setActive(i)}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(i); } }}>
                <circle className="halo" cx={p.x} cy={p.y} r="26" />
                <circle className="disc" cx={p.x} cy={p.y} r="18" />
                <text className="glyph" x={p.x} y={p.y + 4} textAnchor="middle"
                  fontFamily="IBM Plex Mono, monospace" fontSize="11.5">{i + 1}</text>
                <text className="lbl" x={p.x + L.labelDX} y={p.y + L.labelDY} textAnchor={L.anchor}>{node.key}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    /* ---------------------------------------------------- Hero Component */
    function Hero() {
      const [active, setActive] = useState(0);
      const [running, setRunning] = useState(false);
      const [viewMode, setViewMode] = useState("photo"); // 'photo' | 'robot'
      const timers = useRef([]);

      const run = useCallback(() => {
        timers.current.forEach(clearTimeout); timers.current = [];
        setRunning(true); setActive(0);
        PIPELINE.forEach((_, i) => { if (i) timers.current.push(setTimeout(() => setActive(i), i * 750)); });
        timers.current.push(setTimeout(() => setRunning(false), PIPELINE.length * 750));
      }, []);

      useEffect(() => {
        const t = setTimeout(run, 600);
        return () => { clearTimeout(t); timers.current.forEach(clearTimeout); };
      }, [run]);

      const pick = (i) => { timers.current.forEach(clearTimeout); setRunning(false); setActive(i); };
      const node = PIPELINE[active];

      return (
        <header className="hero wrap" id="top">
          <div className="hero-grid">
            <div>
              <div className="avail">
                <span className="pulse" />
                <span>Agentic AI Engineer</span>
              </div>
              <h1 className="name">Satvashil<br />Bhosale</h1>
              <p className="lede">
                I engineer Agentic AI & Compound AI systems that solve real problems in production.
              </p>
              <p className="sub">
                Specializing in LangGraph multi-agent orchestration, Enterprise Lakehouse pipelines,
                Neo4j GraphRAG reasoning, real-time voice telephonic agents, and edge computer vision.
                B.Tech CSE (AI & ML) with 9.80 CGPA.
              </p>

              <div className="badge-row">
                <span className="tech-badge highlight">LangGraph</span>
                <span className="tech-badge cyan">Enterprise Lakehouse</span>
                <span className="tech-badge">GraphRAG / Neo4j</span>
                <span className="tech-badge">Voice AI / Groq</span>
                <span className="tech-badge">TensorRT Edge Vision</span>
              </div>

              <div className="contact-row">
                <a className="btn solid" href={"mailto:" + LINKS.email}>Get In Touch</a>
                <a className="btn" href={LINKS.github} target="_blank" rel="noopener">GitHub</a>
                <a className="btn" href={LINKS.linkedin} target="_blank" rel="noopener">LinkedIn</a>
              </div>
            </div>

            {/* 3D Cyber Agent Robot & Portrait Showcase */}
            <div className="hero-3d-card">
              <div className="hero-3d-header">
                <div className="view-tabs">
                  <button
                    className={`view-tab ${viewMode === "photo" ? "active" : ""}`}
                    onClick={() => setViewMode("photo")}
                  >
                    👤 Satvashil
                  </button>
                  <button
                    className={`view-tab ${viewMode === "robot" ? "active" : ""}`}
                    onClick={() => setViewMode("robot")}
                  >
                    🤖 3D Agent Core
                  </button>
                </div>
                <div className="telemetry-tag">
                  <span className="telemetry-dot" />
                  <span>{viewMode === "photo" ? "PUNE, INDIA" : "AGENT ONLINE"}</span>
                </div>
              </div>

              {viewMode === "robot" ? (
                <div className="hero-canvas-wrap">
                  <RobotAgent3D />
                  <div className="canvas-hud">
                    <div className="hud-box">
                      FPS: <span>60</span> • LATENCY: <span>14ms</span>
                    </div>
                    <div className="hud-box">
                      ORCHESTRATOR: <span>ACTIVE</span>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="photo-frame">
                  <img src="./photo.jpg" alt="Satvashil Bhosale — Agentic AI Engineer" />
                  <p className="photo-caption">Satvashil Bhosale — Agentic AI Engineer</p>
                </div>
              )}
            </div>
          </div>

          {/* Hero Pipeline Visualization */}
          <section className="graph-band" aria-labelledby="graphtitle">
            <div className="graph-head">
              <p className="graph-title" id="graphtitle">
                How my Agentic AI systems execute multi-step workflows. Select a phase:
              </p>
              <button className="replay" onClick={run} disabled={running}>
                {running ? "executing trace…" : "run workflow trace"}
              </button>
            </div>
            <HeroGraph active={active} setActive={pick} />
            <div className="gcard">
              <span className="gcard-idx">{String(active + 1).padStart(2, "0")}</span>
              <div>
                <h3>{node.title}</h3>
                <p>{node.body}</p>
                <div className="chips">
                  {node.stack.map(s => (
                    <span
                      className={`chip ${s.toLowerCase().includes("langgraph") ? "gold" : s.toLowerCase().includes("groq") || s.toLowerCase().includes("whisper") ? "cyan" : ""}`}
                      key={s}
                    >
                      {s}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          </section>
        </header>
      );
    }

    /* ---------------------------------------------------- Capabilities Component */
    function Capabilities() {
      return (
        <section className="sec wrap" id="work">
          <h2 className="sec-head">Core Architectural Focus</h2>
          <p className="sec-note">
            Engineering autonomous AI systems engineered for enterprise constraints:

          </p>
          <div className="caps">
            {CAPS.map((c) => (

    /* ---------------------------------------------------- Systems Component */
    function Systems() {
      return (
        <section className="sec wrap" id="systems">

            Engineered systems visualised as directed state graphs.

          <div className="legend">
            {LEGEND.map(([k, label]) => (<span className={"lg " + k} key={k}><i />{label}</span>))}
          </div>
          {SYSTEMS.map((s) => (
            <article className="sys" key={s.id}>

                  <p className="sys-kind">{s.kind}</p>
                  <h3>{s.name}</h3>

                </div>
                <a className="repo" href={s.repo} target="_blank" rel="noopener">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                  </svg>
                  <span>view code</span>

              </div>

              <div className="scroller-wrap">

              <div className="sys-body">

              {s.spec && (
                <div className="spec">
                  <h4>{s.spec.title}</h4>
                  <table><tbody>
                    {s.spec.rows.map(([a, b], i) => (<tr key={i}><td>{a}</td><td>{b}</td></tr>))}
                  </tbody></table>
                </div>
              )}

              <div className="chips">
                {s.stack.map(t => (
                  <span
                    className={`chip ${t.toLowerCase().includes("langgraph") ? "gold" : t.toLowerCase().includes("groq") || t.toLowerCase().includes("yolo") ? "cyan" : ""}`}
                    key={t}
                  >
                    {t}
                  </span>
                ))}
              </div>
            </article>
          ))}
        </section>
      );
    }

    /* ---------------------------------------------------- Evaluation & Guardrails Component */
    function EvalGuardrails() {
      return (
        <section className="sec wrap" id="eval-guardrails">
          <h2 className="sec-head">LLM Evaluation & Guardrails Engine</h2>
          <p className="sec-note">
            Production agentic AI requires strict safety enforcers and continuous evaluation.
            I deploy automated LLM-as-a-Judge test suites and deterministic guardrail shields to guarantee safety, factual precision, and reliability.
          </p>
          <div className="eval-grid">
            {EVAL_CARDS.map((item) => (
              <TiltCard className="eval-card" key={item.title}>
                <div>
                  <span className={`eval-card-tag ${item.type === "shield" ? "shield" : ""}`}>{item.tag}</span>
                  <h3>{item.title}</h3>
                  <p>{item.desc}</p>
                  <ul className={`eval-features ${item.type === "shield" ? "shield" : ""}`}>
                    {item.features.map(([lead, rest], i) => (
                      <li key={i}><b>{lead}</b>{rest}</li>
                    ))}
                  </ul>
                </div>
                <div className="chips">
                  {item.stack.map(s => (
                    <span className={`chip ${item.type === "shield" ? "gold" : "cyan"}`} key={s}>{s}</span>
                  ))}
                </div>
              </TiltCard>
            ))}
          </div>
        </section>
      );
    }

    /* ---------------------------------------------------- Experience Component */
    function Experience() {
      return (
        <section className="sec wrap" id="experience">
          <h2 className="sec-head">Professional Experience</h2>
          <p className="sec-note">Production deployments spanning enterprise automation, compound AI, and industrial defect detection.</p>
          {JOBS.map(j => (
            <article className="job" key={j.role}>
              <div>
                <p className="job-when">{j.when}</p>
                <h3 className="job-role">{j.role}</h3>
                <p className="job-org">{j.org}</p>
              </div>
              <ul>
                {j.bullets.map(([lead, rest], i) => (
                  <li key={i}><b>{lead}</b>{rest}</li>
                ))}
              </ul>
            </article>
          ))}
        </section>
      );
    }

    /* ---------------------------------------------------- Toolkit Component */
    function Toolkit() {
      return (
        <section className="sec wrap" id="toolkit">
          <h2 className="sec-head">Technical Arsenal</h2>
          <p className="sec-note">Modern frameworks, platforms, and models tested under real-world latency and reliability requirements.</p>
          <div className="kit-grid">
            {KIT.map((k) => (
              <TiltCard className="kit-card" key={k.h}>
                <h3>{k.h}</h3>
                <div className="kit-list">
                  {k.items.map(i => (
                    <span
                      className={`chip ${i.toLowerCase().includes("langgraph") ? "gold" : ""}`}
                      key={i}
                    >
                      {i}
                    </span>
                  ))}
                </div>
              </TiltCard>
            ))}
          </div>
        </section>
      );
    }

    /* ---------------------------------------------------- Writing Component */
    function Writing() {
      if (!POSTS.length) return null;
      return (
        <section className="sec wrap" id="writing">
          <h2 className="sec-head">Technical Insights</h2>
          <p className="sec-note">Engineering logs and architecture breakdowns shared with the AI community.</p>
          <div className="posts">
            {POSTS.map((p, i) => (
              <TiltCard key={i}>
                <a className="post" href={p.href} target="_blank" rel="noopener">
                  <span className="post-meta">{p.reach}</span>
                  <h3>{p.title}</h3>
                  <p>{p.excerpt}</p>
                  <span className="post-foot">
                    <span className="chip">{p.tag}</span>
                    <span className="post-cta">Read on LinkedIn →</span>
                  </span>
                </a>
              </TiltCard>
            ))}
          </div>
          <a className="btn" href={LINKS.linkedin} target="_blank" rel="noopener">
            Follow Along on LinkedIn
          </a>
        </section>
      );
    }

    /* ---------------------------------------------------- Credentials & Education */
    function Credentials() {
      return (
        <section className="sec wrap" id="credentials">
          <h2 className="sec-head">Education & Credentials</h2>
          <div className="cred">
            <div>
              <p className="cred-title">Bachelors in Computer Science Engineering (AI & ML) — CGPA: 9.80</p>
              <p className="cred-sub">D. Y. Patil Agriculture and Technical University, Talasande, Maharashtra</p>
            </div>
            <p className="cred-sub">Aug 2022 — May 2026</p>
          </div>
          {CREDS.map((c) => (
            <div className="cred" key={c.t}>
              <div>
                <p className="cred-title">{c.t}</p>
                <p className="cred-sub">{c.s}</p>
              </div>
              {c.href ? (
                <a href={c.href} target="_blank" rel="noopener">{c.cta} →</a>
              ) : (
                <span className="cred-sub" />
              )}
            </div>
          ))}
        </section>
      );
    }

    /* ---------------------------------------------------- Contact Component */
    function Contact() {
      return (
        <section className="contact" id="contact">
          <div className="wrap">
            <h2>Building an agent that needs to run in production?</h2>
            <p>I am open to Agentic AI engineering roles. Always excited to discuss architecture and complex engineering challenges.</p>
            <a className="mail" href={"mailto:" + LINKS.email}>{LINKS.email}</a>
            <div className="contact-row">
              <a className="btn" href={"tel:" + LINKS.phone.replace(/\s/g, "")}>{LINKS.phone}</a>
              <a className="btn" href={LINKS.github} target="_blank" rel="noopener">GitHub</a>
              <a className="btn" href={LINKS.linkedin} target="_blank" rel="noopener">LinkedIn</a>
            </div>
          </div>
          <div className="wrap">
            <div className="foot">
              <span>Satvashil Bhosale, {new Date().getFullYear()}</span>
              <span>Agentic AI • LangGraph • Neo4j GraphRAG • Multi-Agent Systems</span>
            </div>
          </div>
        </section>
      );
    }

    /* ---------------------------------------------------- Navigation & Mobile Drawer */
    const SECTIONS = [
      ["work", "What I Do"],
      ["systems", "Architectures"],
      ["eval-guardrails", "Eval & Safety"],
      ["experience", "Experience"],
      ["toolkit", "Toolkit"],
      ["writing", "Insights"],
      ["credentials", "Education"],
      ["contact", "Contact"],
    ];

    function Nav() {
      const [on, setOn] = useState("");
      const [mobileOpen, setMobileOpen] = useState(false);

      useEffect(() => {
        const obs = new IntersectionObserver(
          (es) => es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); }),
          { rootMargin: "-40% 0px -50% 0px" }
        );
        SECTIONS.forEach(([id]) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

      const handleLinkClick = () => {
        setMobileOpen(false);
      };

      return (
        <nav className="nav">
          <div className="wrap nav-in">
            <a className="mark" href="#top">
              <span className="mark-dot" />
              <span>Satvashil Bhosale</span>
            </a>
            <div className="nav-links">
              {SECTIONS.map(([id, label]) => (
                <a key={id} href={"#" + id} className={on === id ? "on" : ""}>{label}</a>
              ))}
            </div>
            <div className="nav-actions">
              <a className="nav-cta" href={"mailto:" + LINKS.email}>Get in touch</a>
              <button
                className={`nav-toggle ${mobileOpen ? "open" : ""}`}
                onClick={() => setMobileOpen(!mobileOpen)}
                aria-label="Toggle navigation menu"
              >
                <span /><span /><span />
              </button>
            </div>
          </div>

          {/* Mobile Drawer Menu */}
          <div className={`mobile-drawer ${mobileOpen ? "open" : ""}`}>
            {SECTIONS.map(([id, label]) => (
              <a key={id} href={"#" + id} className={on === id ? "on" : ""} onClick={handleLinkClick}>
                {label}
              </a>
            ))}
            <a className="drawer-cta" href={"mailto:" + LINKS.email} onClick={handleLinkClick}>
              Get In Touch
            </a>
          </div>
        </nav>
      );
    }

    /* ---------------------------------------------------- Root App */
    function App() {
      return (
        <React.Fragment>
          <Nav />
          <Hero />
          <main>
            <Capabilities />
            <Systems />
            <EvalGuardrails />
            <Experience />
            <Toolkit />
            <Writing />
            <Credentials />
          </main>
          <Contact />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
